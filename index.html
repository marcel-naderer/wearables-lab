<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wearable Electronics Lab</title>
<meta name="description" content="Interactive 3D electronics playground for the Seeed Studio XIAO ESP32-C6 – sensors and actuators for the Wearables course.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b1b1d; --bg2:#242526; --bg3:#2d2e31; --line:#3a3b3e; --ink:#ececec; --muted:#a2a7ae;
  --green:#8DC21F; --green2:#6cb33e; --greenbg:#1d2914; --greenline:#4f7a1d;
  --red:#ff4d4f; --redbg:#3b1316; --orange:#ffb020;
  --sans:'Nunito',system-ui,-apple-system,Segoe UI,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
html,body{overflow-x:hidden}
.partsbar{contain:paint}
body{display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer}
code{font-family:var(--mono);font-size:.9em;background:var(--bg3);padding:1px 6px;border-radius:5px}

/* ---------- top nav (Seeed wiki style) ---------- */
header.nav{height:58px;flex:none;display:flex;align-items:center;gap:22px;padding:0 22px;background:var(--bg2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:.2px;white-space:nowrap}
.pinbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:800;font-size:13px;padding:7px 14px;border-radius:999px;margin-right:10px}
.pinbtn:hover{border-color:var(--green);color:var(--green)}
.pmodal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px}
.pmodal[hidden]{display:none}
.pcard{background:var(--bg2);border:1px solid var(--line);border-radius:16px;max-width:min(1400px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.6)}
.phead{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line)}
.phead b{flex:1;font-weight:900;color:var(--green)}
.pclose{border:1px solid var(--line);background:var(--bg);color:var(--ink);width:34px;height:34px;border-radius:10px;font-size:16px;font-weight:900}
.pclose:hover{border-color:var(--green);color:var(--green)}
.pimg{background:#fff;overflow:auto;display:flex;justify-content:center;align-items:center;min-height:0}
.pimg img{display:block;max-width:100%;max-height:calc(100vh - 140px);height:auto}
.pimg img[hidden]{display:none}
.brand .logo{width:34px;height:34px;display:block;flex:none}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#121a06;font-weight:900;font-size:15px}
.brand small{font-weight:700;color:var(--green);font-size:13px;margin-left:4px}
.nav .links{display:flex;gap:20px;font-weight:800;font-size:15px;color:#dcdcdc}
.nav .links span{opacity:.9}
.nav .spacer{flex:1}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px}
.seg button.on{background:var(--green);color:#121a06}


/* ---------- layout ---------- */
main.app>*{min-width:0}
main.app{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:16px;padding:16px;min-height:0;height:calc(100vh - 58px)}
.stage{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;overflow:clip;background:radial-gradient(120% 90% at 60% 30%,#2a2c30 0%,#17181a 70%)}
#three{position:absolute;inset:0}
#three canvas{display:block;width:100%;height:100%;outline:none}
.stage-head{position:absolute;left:24px;top:18px;pointer-events:none;max-width:60%}
.stage-head h1{margin:0;font-size:40px;font-weight:900;line-height:1.05;letter-spacing:-.3px}
.stage-head .sub{color:#c9ccd1;font-size:16px;margin-top:8px;font-weight:600}
.tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(36,37,38,.8);color:#d8dadd}
.tag.if-Analog{color:#7ee08a;border-color:#2f5a35}
.tag.if-I2C{color:#79b8ff;border-color:#24466b}
.tag.if-PWM{color:#ffc266;border-color:#6b4a1c}

.readout{position:absolute;right:16px;top:16px;background:rgba(22,23,25,.9);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:190px;max-width:290px}
.readout .k{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.readout .v{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--green);margin-top:2px}
.readout .s{font-family:var(--mono);font-size:12px;color:#c9ccd1;margin-top:4px;line-height:1.5}

.controls{position:absolute;left:16px;bottom:92px;width:310px;background:rgba(36,37,38,.93);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:14px 16px}

.controls h4{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;margin:0 0 10px;font-size:12px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:var(--green)}
.ctl{margin:10px 0}
.ctl .top{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
.ctl .top b{font-family:var(--mono);color:var(--green);font-weight:600}
input[type=range]{width:100%;accent-color:var(--green);height:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);color:#dfe1e4;font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:6px}
.chips button.on{border-color:var(--green);color:var(--green);background:var(--greenbg)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.btn{border:0;background:var(--green);color:#121a06;font-weight:900;font-size:14px;padding:9px 14px;border-radius:10px}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.switch{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px}
.switch input{appearance:none;width:42px;height:24px;border-radius:999px;background:#4a4c50;position:relative;cursor:pointer;transition:.2s}
.switch input::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:21px}

.partsbar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 14px;background:linear-gradient(to top,rgba(16,17,18,.97) 60%,rgba(16,17,18,0));display:flex;gap:22px;overflow-x:auto;align-items:flex-end}
.pgroup .gl{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin:0 0 7px 2px}
.pgroup .row{display:flex;gap:6px}
.pbtn{border:1px solid var(--line);background:var(--bg2);color:#e3e5e8;font-weight:800;font-size:14px;padding:9px 13px;border-radius:11px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.pbtn:hover{border-color:#5d6066}
.pbtn.on{background:var(--green);border-color:var(--green);color:#121a06}
.pbtn .if{width:8px;height:8px;border-radius:50%}
.pg-sensor .row{display:grid;grid-template-columns:repeat(4,auto);gap:6px}
.sideinfo{position:absolute;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;white-space:nowrap;pointer-events:none;background:rgba(22,23,25,.88);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.pg-actuator .row,.pg-power .row{display:grid;grid-template-columns:auto;gap:6px}
.pg-sensor .row{grid-template-columns:repeat(5,auto) !important}
.partsbar.compact .pbtn{font-size:12.5px;padding:7px 9px}
.partsbar.compact{gap:14px}
.controls{overflow-y:auto}
.credit{font-size:10px;color:var(--muted);font-weight:600;opacity:.55}.credit b{color:var(--muted);font-weight:700}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.legend span{display:flex;align-items:center;gap:5px}

.controls.min .ctl{display:none}.controls.min h4{margin:0}
.controls h4 .tg{font-size:16px;color:var(--muted);line-height:1}
#tip{position:absolute;pointer-events:none;background:#101112;border:1px solid var(--green);color:var(--ink);font-size:13px;padding:8px 11px;border-radius:9px;display:none;max-width:260px;z-index:5;line-height:1.45}
#tip b{color:var(--green);font-size:15px}

/* ---------- right panel ---------- */
aside.panel{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1.15fr);gap:12px;min-height:0}
.ide{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ide pre.code{flex:1.15 1 0;border-radius:0;min-height:90px}
.ide .mon,.ide .plot{flex:1 1 0;min-height:90px}
.serhead{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2)}
.serhead .fn{font-weight:900;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.serhead .seg button{padding:4px 10px;font-size:12px}
aside.panel{grid-template-columns:minmax(0,1fr)}aside.panel>*{min-width:0}
.cbhead .fn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbhead{gap:8px !important}
.infowrap{display:flex;flex-direction:column;gap:12px;min-height:0}
.infowrap .tabbody{flex:1}
.zwrap{--z:1}
.tabbody{font-size:calc(15px*var(--z)) !important}
.tabbody h3{font-size:1.27em !important}
.tabbody .calc{font-size:.93em !important}.tabbody .tipbox,.tabbody .warnbox{font-size:.97em !important}
.tabbody .ds-head{font-size:1.73em}
.tabbody .ds-row .p{font-size:1em}.tabbody .ds-row .w{font-size:.83em}.tabbody .ds-row .val b{font-size:1.4em}.tabbody table.pins{font-size:.93em}
pre.code{font-size:calc(13px*var(--z)) !important}
.mon{font-size:calc(13px*var(--z)) !important}
.zbar{display:flex;gap:3px;flex:none;align-items:center}
.zbar button{border:1px solid var(--line);background:var(--bg);color:#d8dadd;font-weight:900;font-size:12px;width:30px;height:28px;border-radius:8px;padding:0;flex:none}
.zbar button:hover{border-color:var(--green);color:var(--green)}
.tabs .zbar{margin-left:4px;padding-right:2px}
.tabs .zbar button{flex:none;border:1px solid var(--line);background:var(--bg);color:#d8dadd;font-size:12px;padding:0;width:30px;height:28px;border-radius:8px}
.tabs .zbar button.xp.on{background:var(--green);color:#121a06;border-color:var(--green)}
/* expanded panel: right column widens, board stays the main (bigger) window */
main.app{transition:grid-template-columns .25s}
body.zm main.app{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
body.zm-info aside.panel{grid-template-rows:minmax(0,1fr) auto}
body.zm-info .ide pre.code,body.zm-info .ide .serhead,body.zm-info .ide .mon,body.zm-info .ide .plot{display:none !important}
body.zm-ide aside.panel{grid-template-rows:auto minmax(0,1fr)}
body.zm-ide .infowrap .tabbody{display:none}
.zwrap.max{box-shadow:0 0 0 2px var(--green)}
.infowrap.max .tabs,.infowrap.max .tabbody{box-shadow:0 0 0 1px var(--greenline)}
.zbar .xp.on{background:var(--green);color:#121a06;border-color:var(--green)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;min-height:0}
.tabs{display:flex;padding:5px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;color:#cfd2d6;font-weight:800;font-size:15px;padding:10px 6px;border-radius:10px}
.tabs button.on{background:var(--green);color:#121a06}
.tabbody{overflow:auto;padding:20px 22px;font-size:15px;line-height:1.6}
.tabbody h3{font-size:19px;font-weight:900;margin:22px 0 8px}
.tabbody h3:first-child{margin-top:0}
.tabbody p{margin:0 0 10px;color:#dcdee1}
.tabbody ul{margin:0 0 10px;padding-left:20px;color:#dcdee1}
.schem{background:#141516;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0 14px;color:#e6e6e6}
.schem svg{width:100%;height:auto;display:block}
.calc{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;font-family:var(--mono);font-size:14px;line-height:1.85}
.calc .res{color:var(--green);font-weight:700;font-size:17px}
#imuCalc,#gsrDet{white-space:pre-wrap;font-variant-numeric:tabular-nums}
.calc .lbl{font-family:var(--sans);font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.tipbox{background:var(--greenbg);border-left:4px solid var(--green);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:14.5px}
.tipbox .t{font-weight:900;font-size:13px;letter-spacing:.6px;color:var(--green);display:block;margin-bottom:4px}
.warnbox{background:#33270d;border-left:4px solid var(--orange);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:14.5px}
.warnbox .t{font-weight:900;font-size:13px;letter-spacing:.6px;color:var(--orange);display:block;margin-bottom:4px}

.ds-head{font-size:26px;font-weight:900;line-height:1.15;margin:0 0 12px}
.ds-warn{background:var(--redbg);border:2px solid var(--red);border-radius:12px;padding:10px 14px;color:#ffd9da;margin:14px 0 4px}
.ds-warn .big{display:block;font-size:16px;font-weight:900;color:var(--red);line-height:1.3;margin-bottom:2px}
.ds-warn .mid{font-size:14px;font-weight:700;color:#ffb3b5}
.ds-part{font-size:15px;color:var(--green);margin:-4px 0 12px}
.ds-part b{color:var(--green)}
.ds-row{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--bg);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.ds-row .p{font-weight:800;font-size:15px}
.ds-row .w{grid-column:1;font-size:12.5px;color:var(--muted)}
.ds-row .val{grid-row:1 / span 2;grid-column:2;text-align:right}
.ds-row .val b{display:block;font-family:var(--mono);font-size:21px;color:#fff}
.ds-row .val i{font-style:normal;font-size:11px;font-weight:900;color:var(--red);letter-spacing:.6px;text-transform:uppercase}

table.pins{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
table.pins th{text-align:left;font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
table.pins td{padding:8px;border-bottom:1px solid #2f3033;vertical-align:top}
table.pins td.pin{font-family:var(--mono);font-weight:700;white-space:nowrap}
.sw{display:inline-block;width:22px;height:8px;border-radius:4px;vertical-align:middle;margin-right:6px;border:1px solid #555}

/* code */
.codebox{display:flex;flex-direction:column;min-height:0}
.cbhead{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.cbhead .fn{font-family:var(--mono);font-size:13px;font-weight:700;color:#d6d8db;flex:1}
.cbhead .fn span{color:var(--muted);font-weight:400}
.run{display:flex;align-items:center;gap:7px}
.run.stop{background:var(--red);color:#fff}
pre.code{margin:0;overflow:auto;flex:1;min-height:0;padding:12px 0;font-family:var(--mono);font-size:13px;line-height:1.6;color:#d4d4d4;background:#161718;border-radius:0 0 14px 14px}
pre.code .ln{display:block;padding:0 14px 0 0;white-space:pre}
pre.code .ln::before{content:attr(data-n);display:inline-block;width:34px;text-align:right;margin-right:14px;color:#5b5f66}
.k{color:#c586c0}.ty{color:#4ec9b0}.s{color:#ce9178}.n{color:#b5cea8}.f{color:#dcdcaa}.c{color:#6a9955}.pp{color:#9cdcfe}
.live{background:rgba(141,194,31,.22);outline:1px solid rgba(141,194,31,.6);border-radius:4px;padding:0 3px;color:#d6ff8a}

/* serial */
.serial{display:flex;flex-direction:column;min-height:0}
.serial .cbhead .fn{font-family:var(--sans);font-weight:900;font-size:14px}
.serial .seg button{padding:4px 10px;font-size:12px}
.mon{flex:1;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.5;padding:10px 14px;background:#101112;border-radius:0 0 14px 14px;color:#cfe8b8}
.mon .sys{color:#8a8f96}
.mon .empty{color:#7b8087;font-family:var(--sans);font-weight:700}
.plot{flex:1;position:relative;background:#101112;border-radius:0 0 14px 14px;min-height:0}
.plot canvas{position:absolute;inset:0;width:100%;height:100%}
.status{font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.status .led{width:8px;height:8px;border-radius:50%;background:#555}
.status.on .led{background:var(--green);box-shadow:0 0 8px var(--green)}

@media (max-height:820px) and (min-width:1101px){
  main.app{height:auto;align-items:start}
  .stage{height:calc(100vh - 90px);min-height:560px}
  aside.panel{grid-template-rows:440px 560px}
}
@media (max-width:1100px){
  main.app{grid-template-columns:minmax(0,1fr);height:auto}
  .stage{height:78vh;min-height:560px}
  aside.panel{grid-template-rows:auto 560px}
  .infowrap .tabbody{flex:none}
  body.zm main.app{grid-template-columns:minmax(0,1fr)}
  .tabbody{max-height:none}
  .nav .links{display:none}
  .stage-head h1{font-size:30px}
}
@media (max-width:640px){
  header.nav{padding:0 12px;gap:10px}
  .brand{font-size:17px}.brand small{display:none}
  main.app{padding:0 8px 8px}
  .stage{height:86vh}
  .stage-head{left:14px;top:12px}.stage-head{max-width:58% !important}.stage-head h1{font-size:22px}.stage-head .sub{display:none}.tags{display:none}
  .readout{top:12px !important;max-width:38%}
  .controls{width:auto;left:10px;right:10px;bottom:92px;padding:10px 12px;max-height:38%;overflow:auto}
  .ctl{margin:7px 0}
  .readout{top:auto !important;bottom:auto !important;right:10px;top:84px !important;min-width:0;padding:8px 10px}
  .readout .v{font-size:18px}.readout .s{display:none}
  .tabbody{padding:16px}.ds-head{font-size:21px}.ds-warn .big{font-size:19px}
  pre.code{font-size:12px}
  .sideinfo{display:none}
  .stage-head{max-width:90%}
}
</style>
</head>

  const S = 20;
  const tex = canvasTex(BB.W*S, BB.D*S, (g, W, H) => {
    const px = x => (x + BB.W/2)*S, pz = z => (z + BB.D/2)*S;
    g.fillStyle = '#f4f2ec'; g.fillRect(0,0,W,H);

    [[-24.3,'#d43a3a'],[-17.5,'#2d5bd1'],[17.5,'#d43a3a'],[24.3,'#2d5bd1']].forEach(([z,c]) => { g.strokeStyle = c; g.beginPath(); g.moveTo(px(-39), pz(z)); g.lineTo(px(39), pz(z)); g.stroke(); });
    const holeAt = (x,z) => { g.fillStyle = '#4a4a4a'; g.fillRect(px(x)-10, pz(z)-10, 20, 20); g.fillStyle = '#2a2a2a'; g.fillRect(px(x)-7, pz(z)-7, 14, 14); };
    for (let c = 1; c <= 30; c++) for (const r of ROWS) holeAt(colX(c), rowZ(r));
    for (const z of railZ) for (let c = 2; c <= 29; c++){ if ((c-2) % 6 === 5) continue; holeAt(colX(c), z); }
    g.fillStyle = '#8a877e'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const r of ROWS){ g.fillText(r, px(colX(0)), pz(rowZ(r))); g.fillText(r, px(colX(31)), pz(rowZ(r))); }

function wire(a, b, color, parent, lift){
  const d = a.distanceTo(b); const h = lift ?? (6 + d*0.26);
  const a1 = a.clone().add(V3(0,2.2,0)), b1 = b.clone().add(V3(0,2.2,0));
  const curve = new THREE.CubicBezierCurve3(a1, a1.clone().add(V3(0,h,0)), b1.clone().add(V3(0,h,0)), b1);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, .55, 10, false), M(color,{roughness:.45})); m.castShadow = true; parent.add(m);
  for (const p of [a, b]){ rod(p.clone().add(V3(0,-1.2,0)), p.clone().add(V3(0,1.2,0)), .35, MAT.lead, parent); mesh(new THREE.CylinderGeometry(.75,.75,1.6,10), M(0x222222), p.x, p.y+2.2, p.z, parent); }
  return m;
}
function freeWire(a, b, color, parent, sag=8, r=.5){
  const mid = a.clone().add(b).multiplyScalar(.5).add(V3(0, sag, 0));
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, r, 8, false), M(color,{roughness:.5})); m.castShadow = true; parent.add(m); return m;
}
function resistor(h1, h2, ohms, parent, {y=3, bodyColor=0xd9c39a, glass=false, bandCols=null, label=true}={}){
  const a = h1.clone(), b = h2.clone();
  const a2 = V3(a.x, y, a.z), b2 = V3(b.x, y, b.z);
  rod(V3(a.x,-1.5,a.z), a2, .28, MAT.lead, parent); rod(V3(b.x,-1.5,b.z), b2, .28, MAT.lead, parent); rod(a2, b2, .28, MAT.lead, parent);
  const g = new THREE.Group(); g.position.copy(a2).add(b2).multiplyScalar(.5); g.rotation.y = -Math.atan2(b2.z - a2.z, b2.x - a2.x); parent.add(g);
  const len = glass ? 3.8 : 6.2, r = glass ? .95 : 1.25;
  const body = mesh(new THREE.CylinderGeometry(r, r, len, 20), glass ? M(0xff8a3d,{transparent:true, opacity:.75, roughness:.15}) : M(bodyColor), 0,0,0, g); body.rotation.z = Math.PI/2;
  const cols = bandCols || (glass ? null : bands(ohms));
  if (glass){ const bnd = mesh(new THREE.CylinderGeometry(r+.05, r+.05, .7, 20), M(0x111111), len/2 - .6, 0, 0, g); bnd.rotation.z = Math.PI/2; }
  else cols.forEach((c, i) => { const bnd = mesh(new THREE.CylinderGeometry(r+.04, r+.04, .55, 20), M(new THREE.Color(c)), [-2.0,-1.0,0,2.1][i], 0, 0, g); bnd.rotation.z = Math.PI/2; });
  if (!glass && label){ const lb = textSprite(fmtR(ohms), {color:'#ffffff', size:2.1}); lb.position.set(g.position.x, y + 4.2, g.position.z); parent.add(lb); }
  return g;
}

/* breakout-board builder (I²C modules) */
function breakout(parent, {pins, col0=18, w=20, d=16, color='#1f3b73', title='', sub='', row='i'}){
  const n = pins.length; const pz = rowZ(row); const xs = pins.map((_, i) => colX(col0 + i));
  const cx = (xs[0] + xs[n-1]) / 2; w = Math.max(w, n*2.54 + 3); const zc = pz - d/2 + 1.7;
  const hdrH = 2.5, th = 1.6, top = hdrH + th;
  box(n*2.54, hdrH, 2.5, MAT.black, cx, hdrH/2, pz, parent);
  xs.forEach(x => { box(.64, 1.4, .64, MAT.gold, x, top + .45, pz, parent); box(.64, hdrH + 2, .64, MAT.gold, x, hdrH/2 - 1, pz, parent); });
  box(w, th, d, M(color,{roughness:.5}), cx, hdrH + th/2, zc, parent);
  const S = 26;
  const tex = canvasTex(Math.round(w*S), Math.round(d*S), (g, W, H) => {
    g.fillStyle = color; g.fillRect(0,0,W,H);
    g.fillStyle = '#ffffff'; g.textBaseline = 'top'; g.font = `900 ${Math.round(2.4*S)}px Nunito, sans-serif`; g.fillText(title, .9*S, .8*S);
    g.font = `700 ${Math.round(1.5*S)}px Nunito, sans-serif`; g.globalAlpha = .8; g.fillText(sub, .9*S, 3.6*S); g.globalAlpha = 1;
    const pzy = (pz - (zc - d/2)) * S;
    xs.forEach((x, i) => { const u = (x - (cx - w/2)) * S;

/* ---------- GSR phasic-response detector (runs like the code on the board) ---------- */
const GSR_DET = { raw:[], avg:[], inResp:false, ref:0, amp:0, count:0, last:null, t:0 };
function gsrRaw(v, time){ let val = v.fingers ? 2450 - v.sweat*12 + 25*Math.sin(time*.4) : 2780;
  const d = time - v.ev - 1.2; if (v.fingers && d > 0) val -= 420*(d/1.6)*Math.exp(1 - d/1.6);
  return clamp(Math.round(val + rnd(6)), 0, 4095); }
function gsrDetReset(){ Object.assign(GSR_DET, { raw:[], avg:[], inResp:false, ref:0, amp:0, count:0, last:null, t:0, cur:null }); }
function gsrDetStep(v, time){                       // called every 100 ms (10 Hz)
  const D = GSR_DET; D.raw.push(gsrRaw(v, time)); if (D.raw.length > 10) D.raw.shift();
  const avg = D.raw.reduce((a, b) => a + b, 0)/D.raw.length;            // 1) smooth over 1 s
  D.avg.push(avg); if (D.avg.length > 40) D.avg.shift();
  const peak = Math.max(...D.avg);                                       // 2) reference = max of last 4 s
  const thr = 0.03*peak;                                                 // 4) threshold = 3 % of reference
  if (!D.inResp){ const drop = peak - avg;                               // 3) drop
    if (v.fingers && drop > thr){ D.inResp = true; D.ref = peak; D.amp = drop; D.count++; } }
  else { D.amp = Math.max(D.amp, D.ref - avg);                           // track the size of the dip
    if (avg > D.ref - 0.5*D.amp || !v.fingers){ D.inResp = false; D.last = Math.round(D.amp); } }  // 5) half recovered → ready
  D.cur = { avg, peak, drop: (D.inResp ? D.ref : peak) - avg, thr };
}

function vibDots(g, path, n, phase, col, op, r){
  if (!g) return; const L = path.getTotalLength();
  if (g.childNodes.length !== n){ g.innerHTML = ''; for (let i = 0; i < n; i++){ const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('r', r); c.setAttribute('fill', col); g.appendChild(c); } }
  [...g.childNodes].forEach((c, i) => { const q = path.getPointAtLength((((i/n + phase) % 1 + 1) % 1)*L); c.setAttribute('cx', q.x.toFixed(1)); c.setAttribute('cy', q.y.toFixed(1)); c.setAttribute('opacity', op.toFixed(2)); });
}
function vibFigUpdate(v, time){
  const svg = document.getElementById('vibSvg'); if (!svg) return;

  let d = `M${x0},${lo}`;
  for (let k = 0; k < P; k++){ const a = x0 + k*pw, b = a + duty*pw, e = a + pw;
    if (duty <= 0) d += ` L${e},${lo}`; else if (duty >= 1) d += ` L${a},${hi} L${e},${hi}`; else d += ` L${a},${hi} L${b.toFixed(1)},${hi} L${b.toFixed(1)},${lo} L${e.toFixed(1)},${lo}`; }
  $s('vibWave').setAttribute('d', d); $s('vibDuty').textContent = `${String(Math.round(duty*100)).padStart(3,' ')} %`;
  const ph = (time % VIB_T)/VIB_T, on = duty >= 1 || (duty > 0 && ph < duty);
  const cx = x0 + ((time % (VIB_T*P))/(VIB_T*P))*w; $s('vibCursor').setAttribute('x1', cx.toFixed(1)); $s('vibCursor').setAttribute('x2', cx.toFixed(1));
  const tOff = (ph - duty)*VIB_T, fb = (!on && duty > 0 && duty < 1) ? Math.exp(-tOff/0.18) : 0;

  vibDots($s('vibDotsB'), $s('vibBase'), 8, flow*1.2, '#fb8c00', on ? 1 : 0, 3);

  $s('vibIc').textContent = on ? 'I_C ≈ 60 mA' : 'I_C = 0 mA';
  $s('vibIb').textContent = on ? 'I_B ≈ 2.6 mA' : 'I_B = 0 mA';
  $s('vibFbLbl').setAttribute('fill', fb > 0.05 ? '#e040fb' : '#a2a7ae');

  $s('vibState').textContent = on ? (en ? 'D3 HIGH → transistor ON → motor current' : 'D3 HIGH → Transistor AN → Motorstrom')

  if ($s('vibCalcV')){ $s('vibCalcPwm').textContent = v.pwm; $s('vibCalcV').textContent = `${num(VCC*duty,2)} V`; }
}

function pinoutSVG(conns){
  const used = {}; conns.forEach(c => used[c.pin] = c);
  const W = 480, H = 360, bx = 175, bw = 130, by = 40, py = i => by + 38 + i*30;
  let s = `<svg viewBox="0 0 ${W} ${H}" font-family="Nunito, sans-serif"><rect x="${bx}" y="${by}" width="${bw}" height="${H-by-12}" rx="12" fill="#141518" stroke="#55585e" stroke-width="2"/>
    <rect x="${bx+bw/2-22}" y="${by-12}" width="44" height="20" rx="6" fill="#c9ccd1"/><text x="${bx+bw/2}" y="${by+4}" fill="#55585e" font-weight="800" font-size="9" text-anchor="middle">USB-C</text>
    <text x="${bx+bw/2}" y="${H-46}" fill="#8DC21F" font-weight="900" font-size="18" text-anchor="middle">XIAO ESP32-C6</text>
    <text x="${bx+bw/2}" y="${H-28}" fill="#7b8087" font-weight="700" font-size="11" text-anchor="middle">${lang==='en'?'top view · USB up':'Draufsicht · USB oben'}</text>`;
  const side = (arr, left) => arr.forEach((p, i) => { const y = py(i), x = left ? bx : bx+bw, u = used[p];
    const col = u ? wcSvg(u.color) : '#5a5d63';
    s += `<rect x="${x-7}" y="${y-7}" width="14" height="14" rx="3" fill="${u ? col : '#3a3c40'}" stroke="${u ? '#fff' : '#666'}" stroke-width="${u?1.5:1}"/>`;
    s += `<text x="${left ? x+14 : x-14}" y="${y+5}" fill="${u ? '#fff' : '#8a8e95'}" font-size="13" font-weight="${u?900:700}" text-anchor="${left?'start':'end'}">${p}</text>`;
    if (u){ const x2 = left ? 10 : W-10; s += `<line x1="${left ? x-7 : x+7}" y1="${y}" x2="${x2}" y2="${y}" stroke="${col}" stroke-width="3.5" stroke-linecap="round"/><circle cx="${x2}" cy="${y}" r="4" fill="${col}"/>`;
      s += `<text x="${left ? 12 : W-12}" y="${y-8}" fill="${col}" font-size="12" font-weight="900" text-anchor="${left?'start':'end'}">${L(u.short)}</text>`; }
  });
  side(LEFT2D, true); side(RIGHT2D, false);
  return s + '</svg>';
}

{ id:'fsr', group:'sensor', iface:'Analog', btn:{en:'Force sensor (FSR)',de:'Kraftsensor (FSR)'},
  title:{en:'Force Sensitive Resistor',de:'Kraftsensor (FSR)'}, sub:{en:'Press harder – resistance goes down',de:'Fester drücken – Widerstand sinkt'},
  file:'fsr_read.ino', every:200, view:{t:[16,-2,2], d:1.12},
  controls:[{k:'force',type:'range',min:0,max:10,step:.1,unit:'N',label:{en:'Force on the pad',de:'Kraft auf das Pad'}}],
  fsrR(F){ return F < 0.2 ? 1e7 : 10000/Math.pow(F, 1.1); },
  sample(v){ const R = this.fsrR(v.force); const vo = VCC*10000/(10000+R); const adc = clamp(Math.round(vo/VCC*4095 + rnd(3)),0,4095);
    return {print:String(adc), plot:[adc], big:String(adc), small:`F = ${num(v.force,1)} N · R_FSR ≈ ${fmtR(R)}<br>V_A0 = ${num(vo)} V`}; },
  code:v=>`// FSR (force sensor) – read the voltage on A0
const int SENSOR_PIN = A0;      // analog input pin

void setup() {
  Serial.begin(115200);
}

void loop() {
  int value = analogRead(SENSOR_PIN);   // 0 = no press ... 4095
  Serial.println(value);
  delay(200);
}`,
  conns:[{pin:'3V3',color:WC.v3,short:{en:'FSR leg 1',de:'FSR-Bein 1'},to:{en:'FSR leg 1',de:'FSR-Bein 1'}},
         {pin:'D0',color:WC.a0,short:{en:'FSR leg 2 + 10 kΩ',de:'FSR-Bein 2 + 10 kΩ'},to:{en:'FSR leg 2 and one end of the fixed 10 kΩ resistor (A0 = D0)',de:'FSR-Bein 2 und ein Ende des festen 10-kΩ-Widerstands (A0 = D0)'}},
         {pin:'GND',color:WC.gnd,short:{en:'other end of 10 kΩ',de:'anderes Ende 10 kΩ'},to:{en:'Other end of the 10 kΩ resistor',de:'Anderes Ende des 10-kΩ-Widerstands'}}],
  circuit(v){ const R = this.fsrR(v.force), vo = VCC*10000/(10000+R); const en = lang==='en'; return `
    <h3>${t('howWorks')}</h3><p>${en ? 'An FSR is a resistor that changes with force: <b>no press → more than 10 MΩ</b>, hard press → a few hundred Ω. The ADC can only measure a <b>voltage</b>, not a resistance – so we build a <b>voltage divider</b> with a <b>fixed 10 kΩ resistor</b> (often called a pull-down, because it pulls A0 to 0 V when nobody presses).' : 'Ein FSR ist ein Widerstand, der sich mit der Kraft ändert: <b>nicht gedrückt → mehr als 10 MΩ</b>, fest gedrückt → einige hundert Ω. Der ADC kann nur eine <b>Spannung</b> messen, keinen Widerstand – deshalb bauen wir einen <b>Spannungsteiler</b> mit einem <b>festen 10-kΩ-Widerstand</b> (oft Pull-down genannt, weil er A0 auf 0 V zieht, wenn niemand drückt).'}</p>
    <div class="schem" style="padding:12px">${fsrFigSVG()}</div>
    <h3>${t('calc')} <span style="font-size:12px;color:var(--muted)">(${t('live')})</span></h3>
    <div class="calc">V_A0 = 3.3 V × R_fixed / (R_fixed + R_FSR)<br>V_A0 = 3.3 V × 10 kΩ / (10 kΩ + <span id="fsrCalcR">${fmtR(R)}</span>)<br>V_A0 = <span class="res" id="fsrCalcV">${num(vo)} V</span> → ${en?'value':'Wert'} <span class="res" id="fsrCalcA">${Math.round(vo/VCC*4095)}</span></div>
    <p>${en ? 'The fixed resistor sets the <b>sensitivity</b>: a bigger one (e.g. 47 kΩ) reacts to light touches, a smaller one only to hard presses. Without it, A0 would "float" when nobody presses and show random values.' : 'Der feste Widerstand bestimmt die <b>Empfindlichkeit</b>: ein größerer (z. B. 47 kΩ) reagiert auf leichte Berührung, ein kleinerer nur auf festes Drücken. Ohne ihn würde A0 „schweben“, wenn niemand drückt, und Zufallswerte zeigen.'}</p>
    ${warnBox(en ? 'An FSR is <b>not a precise scale</b> (often ±10 % or worse). Great for "pressed / how hard", not for exact Newtons.' : 'Ein FSR ist <b>keine genaue Waage</b> (oft ±10 % oder schlechter). Super für „gedrückt / wie fest“, nicht für exakte Newton.')}`; },
  ds:{part:'FSR 402 (Interlink) + fixed 10 kΩ resistor', search:'"FSR 402 datasheet" / "FSR integration guide"',
    rows:[[{en:'Actuation force (starts to react)',de:'Ansprechkraft'},'0.2 N',{en:'"Actuation force"',de:'„Actuation force“'}],
          [{en:'Force sensitivity range',de:'Messbereich Kraft'},'0.2 – 20 N',{en:'"Force sensitivity range"',de:'„Force sensitivity range“'}],
          [{en:'Resistance, not pressed',de:'Widerstand, ungedrückt'},'> 10 MΩ',{en:'"Non-actuated resistance"',de:'„Non-actuated resistance“'}],
          [{en:'Active area diameter',de:'Durchmesser aktive Fläche'},'12.7 mm',{en:'Mechanical drawing',de:'Mechanische Zeichnung'}],
          [{en:'Force repeatability',de:'Wiederholgenauigkeit'},'± 6 %',{en:'Electrical characteristics',de:'Elektrische Eigenschaften'}],
          [{en:'Fixed resistor (voltage divider)',de:'Fester Widerstand (Spannungsteiler)'},'10 kΩ',{en:'"Force vs. voltage" curve in the guide',de:'Kennlinie „Force vs. Voltage“'}]]},
  build(g){
    const h1 = hole(20,'f'), h2 = hole(21,'f'); legs([h1,h2], 2.2, g, .35);
    const tailMat = M(0xb08a3e,{roughness:.4, metalness:.3});
    const z = h1.z; box(4.5, .4, 5, M(0x1a1a1a), (h1.x+h2.x)/2, 2.4, z, g);
    box(40 - h2.x, .3, 4.2, tailMat, (h2.x + 40)/2 + 1, 2.4, z, g);
    const slope = box(Math.hypot(7, 10.8), .3, 4.2, tailMat, 44.5, 2.4 - 5.4 - .1, z, g); slope.rotation.z = -Math.atan2(10.8, 7);
    box(4, .3, 4.2, tailMat, 49.5, TABLE_Y + .25, z, g);
    const padTex = canvasTex(256,256,(c)=>{ c.fillStyle='#1b1b1b'; c.beginPath(); c.arc(128,128,126,0,7); c.fill(); c.strokeStyle='#b08a3e'; c.lineWidth=5; for(let r=20;r<118;r+=14){c.beginPath();c.arc(128,128,r,0,7);c.stroke();} c.fillStyle='#d8d8d8'; c.font='900 30px Nunito'; c.textAlign='center'; c.fillText('FSR',128,138); });
    const pad = mesh(new THREE.CylinderGeometry(9.2, 9.2, .5, 48), [M(0x1b1b1b), new THREE.MeshStandardMaterial({map:padTex, roughness:.6}), M(0x1b1b1b)], 60, TABLE_Y + .25, z, g);
    const ring = mesh(new THREE.RingGeometry(9.3, 10.8, 48), new THREE.MeshBasicMaterial({color:0x8DC21F, transparent:true, opacity:0, side:THREE.DoubleSide}), 60, TABLE_Y + .6, z, g); ring.rotation.x = -Math.PI/2; ring.castShadow = false;
    const f = finger(g, 30, 4.4); f.rotation.x = -0.75; f.position.set(60, 0, z + 1);
    resistor(hole(21,'h'), hole(26,'h'), 10000, g);
    wire(pinHole('3V3'), hole(20,'j'), WC.v3, g); wire(pinHole('D0'), hole(21,'j'), WC.a0, g); wire(pinHole('GND'), hole(26,'j'), WC.gnd, g);
    const top = TABLE_Y + .5;
    return (v) => { const press = clamp(v.force/0.3, 0, 1); const squish = clamp(v.force/10,0,1)*1.6;
      f.position.y = top + 4.4 - squish + (1-press)*18; ring.material.opacity = clamp(v.force/10,0,1)*.9; };
  } },

{ id:'gsr', group:'sensor', iface:'Analog', btn:{en:'GSR (skin)',de:'GSR (Haut)'},
  title:{en:'Grove GSR – Galvanic Skin Response',de:'Grove GSR – Hautleitwert'}, sub:{en:'Sweat changes how well your skin conducts',de:'Schweiß ändert, wie gut deine Haut leitet'},
  file:'gsr_read.ino', every:200, view:{t:[20,-3,0], d:1.18},
  controls:[{k:'fingers',type:'toggle',label:{en:'Fingers in the electrodes',de:'Finger in den Elektroden'}},
            {k:'sweat',type:'range',min:0,max:100,step:1,unit:'%',label:{en:'Skin moisture (sweat)',de:'Hautfeuchte (Schweiß)'}},
            {k:'ev',type:'button',label:{en:'Surprise! (stress reaction)',de:'Schreck! (Stressreaktion)'}}],

  code:v=>`// Grove GSR – read the skin signal on A0
const int SENSOR_PIN = A0;      // analog input pin

void loop() {

  conns:[{pin:'D0',color:WC.a0,short:{en:'SIG (yellow)',de:'SIG (gelb)'},to:{en:'Grove SIG – yellow wire (A0 = D0)',de:'Grove SIG – gelbes Kabel (A0 = D0)'}},
         {pin:'3V3',color:WC.v3,short:{en:'VCC (red)',de:'VCC (rot)'},to:{en:'Grove VCC – red wire',de:'Grove VCC – rotes Kabel'}},
         {pin:'GND',color:WC.gnd,short:{en:'GND (black)',de:'GND (schwarz)'},to:{en:'Grove GND – black wire',de:'Grove GND – schwarzes Kabel'}}],
  note:{en:'The white Grove wire (NC) is not connected.',de:'Das weiße Grove-Kabel (NC) bleibt frei.'},
  circuit(v){ const en = lang==='en'; return `
    <h3>${t('howWorks')}</h3><p>${en ? 'When you get excited or stressed, your <b>sweat glands</b> open a tiny bit (controlled by the sympathetic nervous system). Sweat contains salt, so your skin <b>conducts better</b> – the skin resistance drops. The Grove module sends a small current through your skin between the two finger electrodes and turns the result into a voltage on <b>SIG</b>.' : 'Wenn du aufgeregt oder gestresst bist, öffnen sich deine <b>Schweißdrüsen</b> ein klein wenig (gesteuert vom Sympathikus). Schweiß enthält Salz, deshalb <b>leitet deine Haut besser</b> – der Hautwiderstand sinkt. Das Grove-Modul schickt einen kleinen Strom zwischen den zwei Fingerelektroden durch deine Haut und macht daraus eine Spannung an <b>SIG</b>.'}</p>
    <h3>${en?'Where is the resistance measured?':'Wo wird der Widerstand gemessen?'}</h3>
    <p>${en ? 'The two electrodes sit on <b>two different fingers</b>. The module sends a tiny, harmless current into one finger – it flows <b>through the skin, across the hand and out through the other finger</b>. That whole path is <b>R_skin</b>. The fingertips have very many sweat glands, so they react strongly.' : 'Die zwei Elektroden sitzen an <b>zwei verschiedenen Fingern</b>. Das Modul schickt einen winzigen, harmlosen Strom in den einen Finger – er fließt <b>durch die Haut, über die Hand und durch den anderen Finger zurück</b>. Dieser ganze Weg ist <b>R_Haut</b>. Die Fingerkuppen haben sehr viele Schweißdrüsen, deshalb reagieren sie stark.'}</p>
    <div class="schem">${gsrPathSVG()}</div>
    <h3>${en?'What you look for: phasic responses':'Worauf du achtest: phasische Reaktionen'}</h3>
    <p>${en ? 'Something happens – a sudden sound, a surprise, a hard question, a deep breath – and your nervous system reacts: the sweat glands open a little, R_skin drops, the value <b>dips</b>. This short dip is a <b>phasic response</b> (also called SCR, skin conductance response).' : 'Etwas passiert – ein plötzliches Geräusch, ein Schreck, eine schwierige Frage, ein tiefer Atemzug – und dein Nervensystem reagiert: die Schweißdrüsen öffnen sich ein wenig, R_Haut sinkt, der Wert <b>bricht ein</b>. Dieser kurze Einbruch ist eine <b>phasische Reaktion</b> (auch SCR, Skin Conductance Response).'}</p>
    <div class="schem">${gsrFigSVG()}</div>
    <table class="pins">
      <tr><td><b>${en?'Delay':'Verzögerung'}</b></td><td>${en?'starts <b>1–3 s after</b> the event – the nerve signal and sweat need time':'beginnt <b>1–3 s nach</b> dem Ereignis – Nervensignal und Schweiß brauchen Zeit'}</td></tr>
      <tr><td><b>${en?'Size':'Größe'}</b></td><td>${en?'how <b>strongly</b> you reacted – bigger surprise, bigger dip':'wie <b>stark</b> du reagiert hast – größerer Schreck, größerer Einbruch'}</td></tr>
      <tr><td><b>${en?'Recovery':'Erholung'}</b></td><td>${en?'slowly back to the baseline in about <b>5–10 s</b>':'langsam zurück zur Grundlinie in ca. <b>5–10 s</b>'}</td></tr>
      <tr><td><b>${en?'Count':'Anzahl'}</b></td><td>${en?'<b>how often</b> it happens per minute – more responses = more stressed / activated':'<b>wie oft</b> es pro Minute passiert – mehr Reaktionen = gestresster / aktivierter'}</td></tr>
    </table>
    <h3>${en?'Detect it in code':'Im Code erkennen'}</h3>
    <div class="calc"><span class="lbl">1 · ${en?'Smooth – remove the noise':'Glätten – Rauschen entfernen'}</span><br>avg = ${en?'mean of the last 1 s':'Mittelwert der letzten 1 s'} <span class="lbl">(${en?'10 samples at 10 Hz':'10 Werte bei 10 Hz'})</span><br>
      <span class="lbl">2 · ${en?'Reference – the level before the dip':'Referenz – das Niveau vor dem Einbruch'}</span><br>ref = ${en?'highest avg of the last 4 s':'höchster avg der letzten 4 s'}<br>
      <span class="lbl">3 · ${en?'Drop':'Einbruch'}</span><br>drop = ref − avg<br>
      <span class="lbl">4 · ${en?'Threshold – relative, because every person is different':'Schwelle – relativ, weil jede Person anders ist'}</span><br>${en?'if':'wenn'} drop > 3 % × ref → <span class="res">${en?'response!':'Reaktion!'}</span><br>
      <span class="lbl">5 · ${en?'Count once, then wait':'Einmal zählen, dann warten'}</span><br>${en?'next response only after the value has recovered half way':'nächste Reaktion erst, wenn der Wert sich zur Hälfte erholt hat'}</div>
    <p>${en ? 'The slow drift of the baseline stays below the threshold – a real response crosses it. Tune the 3 % with the Plotter for your own sensor.' : 'Die langsame Drift der Grundlinie bleibt unter der Schwelle – eine echte Reaktion überschreitet sie. Stimm die 3 % mit dem Plotter auf deinen Sensor ab.'}</p>
    <p>${en ? '<b>Side note:</b> the slow <b>baseline</b> (tonic level) also drifts over minutes – with temperature, dry hands, or how relaxed you are. That is why you always compare to the value <b>a few seconds before</b>, not to a fixed number. The GSR tells you <b>that</b> and <b>when</b> you reacted – not <b>which</b> emotion it was.' : '<b>Nebenbei:</b> Die langsame <b>Grundlinie</b> (tonischer Anteil) driftet über Minuten – mit Temperatur, trockenen Händen oder wie entspannt du bist. Deshalb vergleichst du immer mit dem Wert <b>ein paar Sekunden vorher</b>, nicht mit einer festen Zahl. Der GSR sagt dir, <b>dass</b> und <b>wann</b> du reagiert hast – nicht <b>welche</b> Emotion es war.'}</p>
    <p>${en ? '<b>What disturbs it:</b> moving the fingers or pressing on the electrodes – keep the hand still and relaxed.' : '<b>Was stört:</b> Finger bewegen oder auf die Elektroden drücken – Hand ruhig und locker halten.'}</p>`; },

  sample(v, time){ if (this.lastT === null) this.lastT = time; this.ph += (time - this.lastT)*v.hr/60; this.lastT = time;

  code:v=>`// MAX30100 – read the raw infrared (IR) value
#include <MAX30100.h>           // library: "MAX30100lib"

MAX30100 sensor;
uint16_t ir = 0, red = 0;
unsigned long lastPrint = 0, lastSample = 0;

void setup() {
  Serial.begin(115200);
  delay(2000);                  // time for USB serial

  if (!sensor.begin()) {        // I²C address 0x57
    Serial.println("Sensor not found!");
    while (true) delay(1000);
  }
  sensor.setMode(MAX30100_MODE_SPO2_HR);
  sensor.setLedsCurrent(MAX30100_LED_CURR_7_6MA, MAX30100_LED_CURR_27_1MA);
  sensor.resetFifo();           // clear old samples
}

void loop() {
  sensor.update();              // call often, no delay()
  while (sensor.getRawValues(&ir, &red)) lastSample = millis();

  unsigned long now = millis();
  if (now - lastPrint >= 40) {  // print slowly, keep loop() fast
    lastPrint = now;
    Serial.println(ir);
  }
  if (now - lastSample >= 200) { // full FIFO looks empty: restart it
    sensor.resetFifo();
    lastSample = now;
  }
}`,

    <h3>PWM <span style="font-size:12px;color:var(--muted)">(${t('live')})</span></h3><div class="calc">duty = <span id="ledCalcPwm">${v.pwm}</span> / 255 = <span class="res" id="ledCalcDuty">${Math.round(v.pwm/255*100)} %</span><br>${en?'average current':'mittlerer Strom'} ≈ ${num(c.ia*1000,1)} mA × duty = <span class="res"><span id="ledCalcAvg">${num(c.ia*1000*v.pwm/255,1)}</span> mA</span></div>`; },
  ds:{part:'5 mm LED + resistor', search:'"5mm LED datasheet" + your colour / part number',

    const ledMat = new THREE.MeshStandardMaterial({color:0xff3b30, transparent:true, opacity:.82, roughness:.15, emissive:0xff3b30, emissiveIntensity:0});
    const an = hole(14,'f'), ca = hole(15,'f'); legs([an, ca], 6, g, .3);
    const lx = (an.x + ca.x)/2, lz = an.z;
    const rim = mesh(new THREE.CylinderGeometry(3.0,3.0,.9,32), ledMat, lx, 6.4, lz, g);
    mesh(new THREE.CylinderGeometry(2.55,2.55,5,32), ledMat, lx, 9.3, lz, g);
    mesh(new THREE.SphereGeometry(2.55,32,16,0,Math.PI*2,0,Math.PI/2), ledMat, lx, 11.8, lz, g);
    const gl = glow(0xff3b30, 22, g); gl.position.set(lx, 10, lz);

    const tag2 = textSprite('−', {color:'#fff', size:2.2}); tag2.position.set(ca.x + 2, 15, lz); g.add(tag2);

      if (v.color !== curColor){ curColor = v.color; const c = ledCalc(v.color); if (res) g.remove(res);

        const col = new THREE.Color(c.c.hex); ledMat.color.copy(col).multiplyScalar(v.color === 'white' ? .9 : .85); ledMat.emissive.copy(col); gl.material.color.copy(col); pl.color.copy(col); }
      const c = ledCalc(v.color); const b = run ? clamp(v.pwm/255 * c.ia/0.02, 0, 1.1) : 0;
      ledMat.emissiveIntensity = b*2.6; gl.material.opacity = Math.min(1, b*1.2); gl.scale.setScalar(12 + b*30); pl.intensity = b*3; };
  } },

{ id:'vib', group:'actuator', iface:'PWM', btn:{en:'Vibration motor',de:'Vibrationsmotor'},

  conns:[{pin:'D3',color:WC.d3,short:{en:'1 kΩ → BC337 base (B)',de:'1 kΩ → BC337 Basis (B)'},to:{en:'1 kΩ base resistor → BC337 base (B, middle)',de:'1-kΩ-Basiswiderstand → BC337 Basis (B, Mitte)'}},
         {pin:'3V3',color:WC.v3,short:{en:'motor + and diode stripe',de:'Motor + und Dioden-Ring'},to:{en:'Motor red wire (+) and diode cathode (stripe)',de:'Rotes Motorkabel (+) und Dioden-Kathode (Ring)'}},

  note:{en:'Motor blue wire (−) → BC337 collector (C) and diode anode. BC337 pins with flat side facing you: C – B – E.',de:'Blaues Motorkabel (−) → BC337 Kollektor (C) und Dioden-Anode. BC337-Pins mit der flachen Seite zu dir: C – B – E.'},
  circuit(v){ const en = lang==='en'; return `
    <h3>${t('howWorks')}</h3><p>${en ? 'The motor needs up to <b>60 mA</b> – far more than a GPIO should deliver (≈ 20 mA). It is also a coil (inductive load). So the GPIO only drives the <b>base</b> of an NPN transistor; the transistor switches the motor current between 3V3 and GND (<b>low-side switch</b>).' : 'Der Motor braucht bis zu <b>60 mA</b> – viel mehr, als ein GPIO liefern sollte (≈ 20 mA). Außerdem ist er eine Spule (induktive Last). Deshalb steuert der GPIO nur die <b>Basis</b> eines NPN-Transistors; der Transistor schaltet den Motorstrom zwischen 3V3 und GND (<b>Low-Side-Schalter</b>).'}</p>
    <div class="schem" style="padding:12px">${vibFigSVG()}</div>
    <h3>${en?'Choose the base resistor – step by step':'Basiswiderstand wählen – Schritt für Schritt'}</h3>
    <p>${en ? 'A transistor amplifies the base current: I_C = h_FE × I_B. But h_FE varies a lot (BC337: 100 – 630) and drops with temperature. For a <b>switch</b> we want the transistor <b>fully on (saturated)</b>, so we give it <b>more base current than it needs</b>. The ratio we choose is the <b>forced gain</b> β = I_C / I_B – much smaller than h_FE.' : 'Ein Transistor verstärkt den Basisstrom: I_C = h_FE × I_B. Aber h_FE streut stark (BC337: 100 – 630) und sinkt mit der Temperatur. Für einen <b>Schalter</b> soll der Transistor <b>voll durchschalten (Sättigung)</b> – deshalb geben wir <b>mehr Basisstrom als nötig</b>. Das gewählte Verhältnis ist die <b>erzwungene Verstärkung</b> β = I_C / I_B – viel kleiner als h_FE.'}</p>
    <div class="calc"><span class="lbl">1 · ${en?'Collector current – motor datasheet':'Kollektorstrom – Motor-Datenblatt'}</span><br>I_C = <span class="res">60 mA</span><br>
      <span class="lbl">2 · ${en?'Forced gain – BC337 datasheet, line V_CE(sat)':'Erzwungene Verstärkung – BC337-Datenblatt, Zeile V_CE(sat)'}</span><br>
      V_CE(sat) ${en?'test condition':'Messbedingung'}: I_C = 500 mA, I_B = 50 mA<br>β_forced = 500 mA / 50 mA = <span class="res">10</span><br>
      ${en?'check':'Prüfen'}: β_forced = 10 ≪ h_FE min = 100 ✓<br>
      <span class="lbl">3 · ${en?'Base current – can the GPIO deliver it?':'Basisstrom – schafft das der GPIO?'}</span><br>
      I_B = I_C / β = 60 mA / 10 = <span class="res">6 mA</span>   (${en?'GPIO max ≈ 20 mA':'GPIO max ≈ 20 mA'} ✓)<br>
      <span class="lbl">4 · ${en?'Base resistor – round DOWN (more I_B)':'Basiswiderstand – ABrunden (mehr I_B)'}</span><br>
      R_B = (3.3 V − V_BE) / I_B = (3.3 V − 0.7 V) / 6 mA = 433 Ω → <span class="res">390 Ω</span><br>
      <span class="lbl">5 · ${en?'Check the circuit in this lab (1 kΩ)':'Schaltung in diesem Lab prüfen (1 kΩ)'}</span><br>
      I_B = 2.6 V / 1 kΩ = 2.6 mA → β = 60 / 2.6 = <span class="res">23</span><br>
      23 ≪ h_FE min = 100 → ${en?'still saturated':'trotzdem gesättigt'} ✓</div>
    <p>${en ? '<b>β = 10</b> is the safe recipe straight from the datasheet. At only 60 mA the transistor saturates more easily than at the 500 mA test condition, so <b>1 kΩ (β ≈ 23)</b> works too and saves GPIO current. <b>Rule of thumb:</b> I_B ≈ I_C / 10 … I_C / 20.' : '<b>β = 10</b> ist das sichere Rezept direkt aus dem Datenblatt. Bei nur 60 mA sättigt der Transistor leichter als bei der Messbedingung mit 500 mA – deshalb funktionieren auch <b>1 kΩ (β ≈ 23)</b> und sparen GPIO-Strom. <b>Faustregel:</b> I_B ≈ I_C / 10 … I_C / 20.'}</p>
    <h3>${en?'Why the diode?':'Warum die Diode?'}</h3><p>${en ? 'When the transistor switches off, the motor coil wants to keep the current flowing and produces a <b>voltage spike</b>. The <b>flyback diode</b> (stripe/cathode to 3V3) gives this current a safe path and protects the transistor.' : 'Wenn der Transistor ausschaltet, will die Motorspule den Strom weiterfließen lassen und erzeugt eine <b>Spannungsspitze</b>. Die <b>Freilaufdiode</b> (Ring/Kathode zu 3V3) gibt diesem Strom einen sicheren Weg und schützt den Transistor.'}</p>
    <h3>PWM <span style="font-size:12px;color:var(--muted)">(${t('live')})</span></h3><div class="calc">${en?'average voltage':'mittlere Spannung'} ≈ 3.3 V × <span id="vibCalcPwm">${v.pwm}</span>/255 = <span class="res" id="vibCalcV">${num(VCC*v.pwm/255,2)} V</span><br>${en?'motor rated':'Motor-Nennbereich'}: 2 – 3.6 V → ${en?'below ~2 V it may stall':'unter ~2 V bleibt er evtl. stehen'}</div>

  ds:{part:'SparkFun ROB-08449 + BC337 + 1N4148', search:'"ROB-08449 datasheet", "BC337 datasheet", "1N4148 datasheet"',

  build(g){
    resistor(hole(7,'j'), hole(15,'j'), 1000, g);

    const tr = mesh(new THREE.CylinderGeometry(2.4,2.4,4.6,24,1,false,Math.PI/2,Math.PI), M(0x1a1a1a,{roughness:.6}), B.x, 6.8, B.z - .3, g);

    resistor(hole(14,'h'), hole(20,'h'), 0, g, {glass:true, y:2.6});
    const dl = textSprite('1N4148', {color:'#fff', size:2}); dl.position.set(colX(17), 7.5, rowZ('h')); g.add(dl);
    wire(pinHole('3V3'), hole(20,'j'), WC.v3, g); wire(pinHole('GND'), hole(16,'i'), WC.gnd, g);
    const motor = new THREE.Group(); g.add(motor); const mx = 56, mz = -4, my = TABLE_Y + 1.7;
    mesh(new THREE.CylinderGeometry(5, 5, 3.4, 40), MAT.metal, 0, 0, 0, motor);
    const mt = canvasTex(128,128,c=>{ c.fillStyle='#cfd2d6'; c.fillRect(0,0,128,128); c.fillStyle='#55585e'; c.font='900 22px Nunito'; c.textAlign='center'; c.fillText('ROB-',64,58); c.fillText('08449',64,84); });
    const top = mesh(new THREE.CircleGeometry(4.9, 40), new THREE.MeshStandardMaterial({map:mt, metalness:.4, roughness:.4}), 0, 1.72, 0, motor); top.rotation.x = -Math.PI/2;
    motor.position.set(mx, my, mz);
    const ml = textSprite('M', {color:'#8DC21F', size:3}); ml.position.set(mx, my + 10, mz); g.add(ml);
    [[hole(20,'g'), WC.v3, 2],[hole(14,'g'), '#1e88e5', -2]].forEach(([h, c, dz]) => { rod(h.clone().add(V3(0,-1.2,0)), h.clone().add(V3(0,1.6,0)), .3, MAT.lead, g);
      freeWire(h.clone().add(V3(0,1.6,0)), V3(mx - 5, my, mz + dz), c, g, 9, .4); });
    const waves = []; for (let i = 0; i < 3; i++){ const w = mesh(new THREE.RingGeometry(6, 6.5, 48), new THREE.MeshBasicMaterial({color:0x8DC21F, transparent:true, opacity:0, side:THREE.DoubleSide}), mx, my + .2, mz, g); w.rotation.x = -Math.PI/2; w.castShadow = false; waves.push(w); }
    return (v, time, run) => { const avg = VCC*v.pwm/255; const on = run && avg >= 2.0; const a = on ? .25 + (avg - 2)/1.3*.45 : 0;

  ds:{part:'LiPo 3.7 V', search:'',

/* short role of a XIAO pin for the hover tooltip */
function pinRole(p, v, pin){
  const en = lang === 'en';
  if (pin === '3V3') return en ? '3.3 V supply' : '3,3-V-Versorgung';
  if (pin === 'GND') return 'GND';
  if (p.conns === 'i2c') return pin === 'D4' ? 'SDA (I²C)' : 'SCL (I²C)';
  if (p.id === 'btn') return {up:'INPUT_PULLUP', down:'INPUT_PULLDOWN', float:'INPUT (floating)'}[v.mode];
  if (p.id === 'bat') return `INPUT (A0) · 2 × 200 kΩ ${en ? 'divider' : 'Teiler'}`;
  const R = p.id === 'led' ? fmtR(ledCalc(v.color).re) : p.id === 'vib' ? '1 kΩ' : p.id === 'fsr' ? (lang==='en' ? '10 kΩ fixed resistor' : '10 kΩ fester Widerstand') : null;
  const mode = p.group === 'actuator' ? 'OUTPUT (PWM)' : 'INPUT (A0)';
  return R ? `${mode} · ${R}` : mode;
}
/* I²C connection list generator */
function highlightPads(p){
  const used = new Set(connsOf(p, V[p.id]).map(c => c.pin));
  const colorOf = Object.fromEntries(connsOf(p, V[p.id]).map(c => [c.pin, c.color]));
  pads.forEach(pd => { const u = used.has(pd.userData.pin); pd.material.emissive = new THREE.Color(u ? (colorOf[pd.userData.pin] === WC.gnd ? '#888888' : colorOf[pd.userData.pin]) : '#000'); pd.material.emissiveIntensity = u ? .55 : 0; });
}
function connsOf(p, v){
  if (p.conns === 'i2c'){ const [vcc, gnd, sda, scl] = p.i2cPins; return [
    {pin:'3V3', color:WC.v3, short:vcc, to:{en:`${vcc} (power)`,de:`${vcc} (Versorgung)`}},
    {pin:'GND', color:WC.gnd, short:gnd, to:{en:'GND (ground)',de:'GND (Masse)'}},
    {pin:'D4', color:WC.sda, short:sda, to:{en:'SDA – I²C data',de:'SDA – I²C-Daten'}},
    {pin:'D5', color:WC.scl, short:scl, to:{en:'SCL – I²C clock',de:'SCL – I²C-Takt'}} ]; }
  return p.conns.filter(c => !c.when || c.when(v)).map(c => ({...c, short: typeof c.short === 'function' ? c.short(v) : c.short, to: typeof c.to === 'function' ? c.to(v) : c.to}));
}

/* code view with tiny syntax highlighter */
function hl(src){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return src.split('\n').map((line, i) => {
    let code = line, com = ''; const ci = line.indexOf('//'); if (ci >= 0){ code = line.slice(0, ci); com = line.slice(ci); }
    let h;
    if (/^\s*#include/.test(code)) h = `<span class="pp">${esc(code)}</span>`;
    else h = esc(code).replace(/("(?:[^"\\]|\\.)*")|(\b(?:void|int|float|const|if|return|bool|long|unsigned|uint8_t|uint16_t|while)\b)|(\b(?:Adafruit_\w+|BMP581|MAX30100|sensors_event_t|bmp5_sensor_data|Serial|Wire)\b)|(\b0x[0-9A-Fa-f]+\b|\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*(?=\())/g,
      (m, s, k, ty, n, f) => s ? `<span class="s">${s}</span>` : k ? `<span class="k">${k}</span>` : ty ? `<span class="ty">${ty}</span>` : n ? `<span class="n">${n}</span>` : `<span class="f">${f}</span>`);
    h = h.replace(/«(.*?)»/g, '<span class="live">$1</span>');
    return `<span class="ln" data-n="${i+1}">${h}${com ? `<span class="c">${esc(com)}</span>` : ''}</span>`;
  }).join('');
}
function renderCode(){ $('#code').innerHTML = hl(cur.code(V[cur.id])); }

  const zf = ZOOM.ide; const W = r.width, H = r.height, padL = 54*zf, padR = 10, padT = 22*zf, padB = 14;
  g.fillStyle = '#101112'; g.fillRect(0,0,W,H);
  if (!plotBuf.length){ g.fillStyle = '#7b8087'; g.font = '700 13px Nunito'; g.fillText(t('empty'), 14, H/2); return; }
  let mn = Infinity, mx = -Infinity; plotBuf.forEach(a => a.forEach(x => { mn = Math.min(mn, x); mx = Math.max(mx, x); }));
  if (mx - mn < 1e-6){ mx += 1; mn -= 1; } const pad = (mx - mn)*.12; mn -= pad; mx += pad;
  const X = i => padL + i/(240 - 1)*(W - padL - padR), Y = x => padT + (1 - (x - mn)/(mx - mn))*(H - padT - padB);
  g.strokeStyle = '#26282b'; g.lineWidth = 1; g.fillStyle = '#7b8087'; g.font = `${Math.round(11*zf)}px JetBrains Mono`; g.textAlign = 'right';
  for (let k = 0; k <= 4; k++){ const val = mn + (mx - mn)*k/4, y = Y(val); g.beginPath(); g.moveTo(padL, y); g.lineTo(W - padR, y); g.stroke(); g.fillText(Math.abs(val) >= 1000 ? Math.round(val) : val.toFixed(2), padL - 6, y + 4); }
  const v0 = V[cur.id]; const cols = cur.plotColors ? cur.plotColors(v0) : ['#8DC21F','#4aa3ff','#ffd54f']; const n = plotBuf[0].length; const off = 240 - plotBuf.length;
  for (let s = 0; s < n; s++){ g.strokeStyle = cols[s]; g.lineWidth = 2; g.beginPath(); plotBuf.forEach((a, i) => { const x = X(i + off), y = Y(a[s]); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); }
  const labs = (typeof cur.plotLabels === 'function' ? cur.plotLabels(v0) : cur.plotLabels) || ['value']; g.textAlign = 'left'; g.font = `800 ${Math.round(12*zf)}px Nunito`;
  let lx = padL; labs.forEach((l, i) => { g.fillStyle = cols[i]; g.fillText('● ' + l, lx, 14*zf); lx += g.measureText('● ' + l).width + 14; });
}

/* ---------- zoom / expand panels ---------- */
const ZOOM = {info:1, ide:1};
try { localStorage.removeItem('xiaolab-zoom'); } catch(e) {}
const zEl = k => ({info:$('#zInfo'), ide:$('#zIde')})[k];
function applyZoom(){ for (const k in ZOOM) zEl(k).style.setProperty('--z', ZOOM[k]); if (serView === 'plot') drawPlot(); }
let zMax = null;
function setMax(k){
  if (zMax) { zEl(zMax).classList.remove('max'); document.querySelector(`.zbar[data-k=${zMax}] .xp`).classList.remove('on'); }
  zMax = (k && k !== zMax) ? k : null;
  if (zMax) { zEl(zMax).classList.add('max'); document.querySelector(`.zbar[data-k=${zMax}] .xp`).classList.add('on'); }
  document.body.classList.toggle('zm', !!zMax); document.body.classList.toggle('zm-info', zMax === 'info'); document.body.classList.toggle('zm-ide', zMax === 'ide');
  document.querySelectorAll('.zbar .xp').forEach(b => { const on = b.classList.contains('on'); b.textContent = on ? '⤡' : '⤢'; b.title = on ? 'Back to normal size' : 'Make this panel bigger'; });
  requestAnimationFrame(() => { if (serView === 'plot') drawPlot(); });
}
document.querySelectorAll('.zbar').forEach(bar => {
  const k = bar.dataset.k;
  bar.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { ZOOM[k] = Math.round(clamp(ZOOM[k] + (+b.dataset.z)*0.1, 0.8, 1.8)*100)/100; applyZoom(); });
  bar.querySelector('.xp').onclick = () => setMax(k);
});
window.addEventListener('keydown', e => { if (e.key === 'Escape' && zMax) setMax(null); });
new ResizeObserver(() => { if (serView === 'plot') drawPlot(); }).observe($('#plot'));
applyZoom();

/* ---------- XIAO pinout pop-up ---------- */
function pinShow(side){ $('#pinFront').hidden = side !== 'front'; $('#pinBack').hidden = side !== 'back'; document.querySelectorAll('#pinSeg button').forEach(b => b.classList.toggle('on', b.dataset.s === side)); }
$('#pinBtn').onclick = () => { $('#pinModal').hidden = false; };
$('#pinClose').onclick = () => { $('#pinModal').hidden = true; };
$('#pinModal').onclick = e => { if (e.target.id === 'pinModal') $('#pinModal').hidden = true; };
document.querySelectorAll('#pinSeg button').forEach(b => b.onclick = () => pinShow(b.dataset.s));
window.addEventListener('keydown', e => { if (e.key === 'Escape') $('#pinModal').hidden = true; });

/* ---------- events ---------- */
$('#runBtn').onclick = () => running ? stop() : start();
$('#clearBtn').onclick = () => { mon.innerHTML = running ? '' : `<div class="empty">${t('empty')}</div>`; plotBuf = []; if (serView === 'plot') drawPlot(); };
document.querySelectorAll('#tabs button[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; renderStatic(); renderTab(); $('#tabbody').scrollTop = 0; });
document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('xiaolab-lang', lang); } catch(e) {} renderAll(); if (!running) mon.innerHTML = `<div class="empty">${t('empty')}</div>`; });
document.querySelectorAll('#serSeg button').forEach(b => b.onclick = () => { serView = b.dataset.v; $('#mon').style.display = serView === 'mon' ? '' : 'none'; $('#plot').style.display = serView === 'plot' ? '' : 'none'; renderStatic(); if (serView === 'plot') drawPlot(); });

/* hover tooltips on XIAO pins */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('#tip');
renderer.domElement.addEventListener('pointermove', e => {
  const r = renderer.domElement.getBoundingClientRect(); mouse.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1);
  ray.setFromCamera(mouse, camera); const hit = ray.intersectObjects(pads)[0];
  if (hit){ const p = hit.object.userData.pin, info = PINS[p].info; const u = connsOf(cur, V[cur.id]).find(c => c.pin === p);
    tip.innerHTML = u ? `<b>${p}</b><br><span style="color:#8DC21F;font-weight:800">${pinRole(cur, V[cur.id], p)}</span>` : `<b>${p}</b><br><span style="color:#a2a7ae">${L(info)}</span>`;
    tip.style.display = 'block'; const sr = $('#stage').getBoundingClientRect(); tip.style.left = (e.clientX - sr.left + 14) + 'px'; tip.style.top = (e.clientY - sr.top + 14) + 'px'; renderer.domElement.style.cursor = 'help'; }
  else { tip.style.display = 'none'; renderer.domElement.style.cursor = ''; }
});
renderer.domElement.addEventListener('pointerleave', () => tip.style.display = 'none');

/* ---------- resize + loop ---------- */
function resize(){ const r = host.getBoundingClientRect(); if (!r.width || !r.height) return; renderer.setSize(r.width, r.height, false); camera.aspect = r.width/r.height;
  camera.fov = r.width/r.height < 1 ? 50 : 36;
  const narrow = r.width < 700; camera.setViewOffset(r.width, r.height, narrow ? 0 : -r.width*0.07, r.height*(narrow ? 0.10 : 0.07), r.width, r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(host); window.addEventListener('resize', () => { resize(); placeControls(); if (serView === 'plot') drawPlot(); });
let lastRead = 0;
function loop(now){
  requestAnimationFrame(loop);
  const time = now/1000;
  if (camTween){ const k = clamp((now - camTween.t0)/900, 0, 1), e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(camTween.from.p, camTween.to.p, e); controls.target.lerpVectors(camTween.from.t, camTween.to.t, e); if (k >= 1) camTween = null; }
  controls.update();
  if (cur.id === 'fsr' && tab === 'circuit') fsrFigUpdate(V.fsr);
  if (cur.id === 'led' && tab === 'circuit') ledFigUpdate(V.led);
  if (cur.id === 'vib' && tab === 'circuit') vibFigUpdate(V.vib, time);
  if (cur.id === 'btn' && tab === 'circuit') btnFigUpdate(V.btn, time);
  if (cur.id === 'bat'){ batAnimStep(V.bat, Math.min(.25, time - (loop.bt || time))); if (tab === 'circuit') batFigUpdate(V.bat, time); }
  loop.bt = time;
  if (cur.id === 'imu' && tab === 'circuit' && now - (loop.ic || 0) > 350){ loop.ic = now; const ic = document.getElementById('imuCalc'); if (ic) ic.innerHTML = cur.calcHTML(V.imu); }
  if (updater) updater(V[cur.id], time, running);
  if (now - lastRead > 120){ lastRead = now; const s = cur.id === 'max' ? (()=>{ const r = cur.sample(V.max, time); return r; })() : cur.sample(V[cur.id], time);
    $('#readout').innerHTML = `<div class="k">${cur.readLabel ? L(typeof cur.readLabel === 'function' ? cur.readLabel(V[cur.id]) : cur.readLabel) : cur.iface === 'I2C' ? (lang==='en'?'sensor value':'Sensorwert') : cur.group === 'actuator' ? (lang==='en'?'output':'Ausgang') : 'analogRead(SENSOR_PIN)'}</div><div class="v">${s.big}</div><div class="s">${s.small}</div>`; }
  renderer.render(scene, camera);
}

/* ---------- boot ---------- */
try { const sl = localStorage.getItem('xiaolab-lang'); if (sl === 'de' || sl === 'en') lang = sl; } catch(e) {}
const startId = (location.hash || '').slice(1);
cur = PART[startId] || PART.led;
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (PART[id] && id !== cur.id) selectPart(id); });
resize(); selectPart(cur.id); requestAnimationFrame(loop);
</script>
</body>
